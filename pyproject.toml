[project]
name = "flow-mcp"
version = "0.1.0"
description = "Unofficial personal MCP wrapper for Flow.team web endpoints"
requires-python = ">=3.10"
dependencies = [
  "mcp>=1.9.0",
  "httpx>=0.27.0",
  "python-dotenv>=1.0.1",
  "cryptography>=42.0.0",
  "pyyaml>=6.0.0",
]

[dependency-groups]
dev = [
  "pytest>=8.0.0",
]

[project.scripts]
flow-mcp = "flow_mcp.server:main"
flow-mcp-setup = "flow_mcp.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["flow_mcp"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
